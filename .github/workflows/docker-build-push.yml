name: Parameterized Docker Pipeline

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag'
        required: true
        default: 'latest'

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:${{ github.event.inputs.image_tag }} .

      - name: Snyk Container Scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ secrets.DOCKER_USERNAME }}/user-service:${{ github.event.inputs.image_tag }}
          args: --file=Dockerfile --severity-threshold=high

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/user-service:${{ github.event.inputs.image_tag }}

  notify:
    needs: build-scan-push
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Docker Build & Push Result - ${{ needs.build-scan-push.result }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Actions
          body: >
            The Docker build and push pipeline for tag "${{ github.event.inputs.image_tag }}" finished with status ${{ needs.build-scan-push.result }}.
            See run details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
