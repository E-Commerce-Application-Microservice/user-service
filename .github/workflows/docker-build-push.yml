name: Parameterized Docker Pipeline

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag'
        required: true
        default: 'latest'

jobs:
  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:${{ github.event.inputs.image_tag }} .

      - name: Save Docker Image to Tar Archive
        run: docker save ${{ secrets.DOCKER_USERNAME }}/user-service:${{ github.event.inputs.image_tag }} > image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: image.tar
          retention-days: 1

  scan-image:
    name: Scan Image
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact

      - name: Load Docker Image
        run: docker load -i image.tar

      - name: Snyk Container Scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ secrets.DOCKER_USERNAME }}/user-service:${{ github.event.inputs.image_tag }}
          args: --severity-threshold=high

  push-image:
    name: Push Image
    needs: scan-image
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact

      - name: Load Docker Image
        run: docker load -i image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/user-service:${{ github.event.inputs.image_tag }}

  notify:
    name: Send Email
    needs: [build-image, scan-image, push-image]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Docker Build & Push Result
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Actions
          body: >
            The Docker pipeline for tag "${{ github.event.inputs.image_tag }}" finished.
            Build: ${{ needs.build-image.result }}
            Scan: ${{ needs.scan-image.result }}
            Push: ${{ needs.push-image.result }}
            See run details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
