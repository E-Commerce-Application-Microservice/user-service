
name: SonarCloud Analysis & Quality Gate

on:
  push:
    branches: [ "main", "M-VIGNESH3-patch-1" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs: 
  sonar-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=E-Commerce-Application-Microservice_authentication-service
            -Dsonar.organization=e-commerce-application-microservice

            -Dsonar.sources=.

      - name: Send Email on Quality Gate Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ SonarCloud Quality Gate Failed: ${{ github.repository }}"
          to: your-email@example.com
          from: GitHub Actions CI
          body: |
            SonarCloud Quality Gate FAILED.

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
 
            Check SonarCloud dashboard for details.
